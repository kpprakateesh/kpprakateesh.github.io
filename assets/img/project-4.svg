<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Concept study: office floor plan with meeting rooms, desks and a lounge">
  <defs>
    <pattern id="p4grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#0f4d29" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="1000" fill="#f7f2e7"/>
  <rect x="60" y="120" width="680" height="760" fill="url(#p4grid)"/>

  <!-- shell -->
  <g stroke="#0f4d29" stroke-width="9" fill="none">
    <path d="M60 120h680v760H60z"/>
    <path d="M60 470h300"/>
    <path d="M360 330h380"/>
    <path d="M520 470v410"/>
  </g>

  <!-- door openings -->
  <g stroke="#f7f2e7" stroke-width="12">
    <path d="M300 470h60"/>
    <path d="M520 620v60"/>
    <path d="M250 120v-0"/>
  </g>

  <!-- meeting room furniture -->
  <g>
    <rect x="110" y="200" width="190" height="90" rx="16" fill="#a6e0bb"/>
    <g fill="#0f4d29">
      <circle cx="150" cy="178" r="16"/><circle cx="205" cy="178" r="16"/><circle cx="260" cy="178" r="16"/>
      <circle cx="150" cy="312" r="16"/><circle cx="205" cy="312" r="16"/><circle cx="260" cy="312" r="16"/>
    </g>
    <rect x="112" y="352" width="80" height="80" rx="8" fill="none" stroke="#0f4d29" stroke-width="3"/>
    <rect x="212" y="352" width="80" height="80" rx="8" fill="none" stroke="#0f4d29" stroke-width="3"/>
  </g>

  <!-- desk rows (open work) -->
  <g fill="#e7dcc7" stroke="#0f4d29" stroke-width="3">
    <rect x="400" y="180" width="130" height="56" rx="6"/>
    <rect x="580" y="180" width="130" height="56" rx="6"/>
    <rect x="400" y="260" width="130" height="56" rx="6"/>
    <rect x="580" y="260" width="130" height="56" rx="6"/>
  </g>
  <g fill="#0f4d29">
    <circle cx="430" cy="152" r="12"/><circle cx="500" cy="152" r="12"/>
    <circle cx="610" cy="152" r="12"/><circle cx="680" cy="152" r="12"/>
    <circle cx="430" cy="248" r="12"/><circle cx="500" cy="248" r="12"/>
    <circle cx="610" cy="248" r="12"/><circle cx="680" cy="248" r="12"/>
  </g>

  <!-- lounge with round table -->
  <circle cx="240" cy="640" r="62" fill="#c79a5b"/>
  <circle cx="240" cy="640" r="34" fill="none" stroke="#fbf9f3" stroke-opacity="0.55" stroke-width="3"/>
  <g fill="#0f4d29">
    <circle cx="240" cy="558" r="15"/><circle cx="240" cy="722" r="15"/>
    <circle cx="158" cy="640" r="15"/><circle cx="322" cy="640" r="15"/>
  </g>

  <!-- lounge sofa -->
  <g>
    <rect x="120" y="760" width="300" height="72" rx="18" fill="#0f4d29"/>
    <rect x="140" y="776" width="120" height="40" rx="10" fill="#a6e0bb"/>
    <rect x="280" y="776" width="120" height="40" rx="10" fill="#e7dcc7"/>
  </g>

  <!-- phone booths -->
  <g>
    <rect x="580" y="540" width="90" height="90" rx="8" fill="none" stroke="#0f4d29" stroke-width="3"/>
    <rect x="580" y="650" width="90" height="90" rx="8" fill="none" stroke="#0f4d29" stroke-width="3"/>
    <path d="M600 630h50" stroke="#c79a5b" stroke-width="3"/>
  </g>

  <!-- storage -->
  <g fill="#e7dcc7" stroke="#0f4d29" stroke-width="3">
    <rect x="560" y="760" width="140" height="60" rx="6"/>
    <rect x="560" y="820" width="140" height="60" rx="6"/>
  </g>

  <!-- dimensions -->
  <g stroke="#86632b" stroke-width="1.5" fill="#86632b">
    <path d="M60 96h680"/>
    <path d="M60 88v16M740 88v16M360 88v16M520 88v16"/>
    <path d="M784 120v760"/>
    <path d="M776 120h16M776 880h16M776 470h16"/>
  </g>

  <!-- north arrow -->
  <g transform="translate(680 60)">
    <circle r="26" fill="none" stroke="#0f4d29" stroke-opacity="0.4" stroke-width="2"/>
    <path d="M0 -18L8 6 0 0-8 6z" fill="#0f4d29"/>
  </g>
</svg>
