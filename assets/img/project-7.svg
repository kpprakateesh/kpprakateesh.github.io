      <circle cx="452" cy="654" r="18"/>
      <circle cx="484" cy="638" r="14"/>
    </g>
    <rect x="372" y="700" width="120" height="8" rx="4" fill="#c79a5b"/>
  </g>

  <!-- workstation rows -->
  <g>
    <!-- far row -->
    <rect x="70" y="640" width="636" height="18" rx="6" fill="#0d1a12" opacity="0.12"/>
    <g>
      <rect x="120" y="600" width="160" height="40" rx="5" fill="url(#p7desk)"/>
      <rect x="120" y="600" width="160" height="40" rx="5" fill="none" stroke="#0d1a12" stroke-opacity="0.18" stroke-width="2"/>
      <rect x="140" y="528" width="92" height="62" rx="4" fill="#0d1a12"/>
      <rect x="146" y="534" width="80" height="44" rx="2" fill="#a6e0bb" opacity="0.75"/>
      <rect x="180" y="590" width="12" height="16" fill="#0d1a12"/>
      <rect x="166" y="603" width="40" height="6" rx="3" fill="#0d1a12"/>
    </g>
    <g>
      <rect x="310" y="600" width="150" height="40" rx="5" fill="url(#p7desk)"/>
      <rect x="310" y="600" width="150" height="40" rx="5" fill="none" stroke="#0d1a12" stroke-opacity="0.18" stroke-width="2"/>
      <rect x="330" y="528" width="88" height="62" rx="4" fill="#0d1a12"/>
      <rect x="336" y="534" width="76" height="44" rx="2" fill="#dcebd5" opacity="0.9"/>
      <rect x="368" y="590" width="12" height="16" fill="#0d1a12"/>
      <rect x="354" y="603" width="40" height="6" rx="3" fill="#0d1a12"/>
    </g>
    <g>
      <rect x="540" y="600" width="166" height="40" rx="5" fill="url(#p7desk)"/>
      <rect x="540" y="600" width="166" height="40" rx="5" fill="none" stroke="#0d1a12" stroke-opacity="0.18" stroke-width="2"/>
      <rect x="562" y="528" width="90" height="62" rx="4" fill="#0d1a12"/>
      <rect x="568" y="534" width="78" height="44" rx="2" fill="#a6e0bb" opacity="0.75"/>
      <rect x="602" y="590" width="12" height="16" fill="#0d1a12"/>
      <rect x="588" y="603" width="40" height="6" rx="3" fill="#0d1a12"/>
    </g>

    <!-- task chairs far row -->
    <g fill="#0f4d29">
      <path d="M158 640h44v34a8 8 0 0 1-8 8h-28a8 8 0 0 1-8-8z"/>
      <path d="M348 640h44v34a8 8 0 0 1-8 8h-28a8 8 0 0 1-8-8z"/>
      <path d="M578 640h44v34a8 8 0 0 1-8 8h-28a8 8 0 0 1-8-8z"/>
    </g>
    <g stroke="#0d1a12" stroke-width="4" stroke-linecap="round">
      <path d="M180 682v24M370 682v24M600 682v24"/>
      <path d="M162 740l18-22 18 22M352 740l18-22 18 22M582 740l18-22 18 22"/>
    </g>

    <!-- near row: long bench desk -->
    <rect x="40" y="786" width="720" height="34" rx="8" fill="url(#p7desk)"/>
    <rect x="40" y="786" width="720" height="34" rx="8" fill="none" stroke="#0d1a12" stroke-opacity="0.2" stroke-width="3"/>
    <rect x="60" y="820" width="680" height="12" rx="4" fill="#0d1a12" opacity="0.08"/>
    <g fill="#0d1a12">
      <rect x="110" y="748" width="86" height="30" rx="4"/>
      <rect x="300" y="748" width="86" height="30" rx="4"/>
      <rect x="490" y="748" width="86" height="30" rx="4"/>
      <rect x="650" y="748" width="60" height="30" rx="4"/>
    </g>
    <g fill="#a6e0bb" opacity="0.8">
      <rect x="116" y="753" width="74" height="18" rx="2"/>
      <rect x="306" y="753" width="74" height="18" rx="2"/>
      <rect x="496" y="753" width="74" height="18" rx="2"/>
      <rect x="656" y="753" width="48" height="18" rx="2"/>
    </g>
    <g stroke="#0d1a12" stroke-width="5">
      <path d="M120 786v-14M186 786v-14M310 786v-14M376 786v-14M500 786v-14M566 786v-14M656 786v-14M704 786v-14"/>
    </g>
    <!-- near chairs backs -->
    <g fill="#17703f">
      <path d="M132 856h56v58a10 10 0 0 1-10 10h-36a10 10 0 0 1-10-10z"/>
      <path d="M322 856h56v58a10 10 0 0 1-10 10h-36a10 10 0 0 1-10-10z"/>
      <path d="M512 856h56v58a10 10 0 0 1-10 10h-36a10 10 0 0 1-10-10z"/>
    </g>
    <g stroke="#0d1a12" stroke-width="5" stroke-linecap="round">
      <path d="M160 924v26M350 924v26M540 924v26"/>
      <path d="M136 980l24-30 24 30M326 980l24-30 24 30M516 980l24-30 24 30"/>
    </g>
  </g>

  <!-- rug -->
  <ellipse cx="400" cy="932" rx="330" ry="46" fill="#c79a5b" opacity="0.2"/>
  <ellipse cx="400" cy="932" rx="300" ry="34" fill="none" stroke="#86632b" stroke-opacity="0.28" stroke-width="2"/>

  <!-- foreground plant -->
  <g transform="translate(28 690)">
    <rect x="0" y="120" width="54" height="70" rx="8" fill="#c79a5b"/>
    <rect x="6" y="128" width="42" height="54" rx="5" fill="#8a6231" opacity="0.5"/>
    <g stroke="#0f4d29" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M27 120V70M27 96 6 76M27 90l24-22"/>
    </g>
    <g fill="#17703f">
      <ellipse cx="4" cy="66" rx="20" ry="9" transform="rotate(-28 4 66)"/>
      <ellipse cx="52" cy="60" rx="22" ry="10" transform="rotate(24 52 60)"/>
      <ellipse cx="27" cy="46" rx="16" ry="24"/>
      <ellipse cx="10" cy="92" rx="18" ry="8" transform="rotate(-16 10 92)"/>
      <ellipse cx="44" cy="88" rx="18" ry="8" transform="rotate(18 44 88)"/>
    </g>
    <g fill="#a6e0bb" opacity="0.7">
      <ellipse cx="27" cy="36" rx="8" ry="14"/>
    </g>
  </g>

  <!-- floor lamp + small details -->
  <g>
    <path d="M744 470v310" stroke="#0d1a12" stroke-width="4"/>
    <path d="M728 780h32" stroke="#0d1a12" stroke-width="5" stroke-linecap="round"/>
    <path d="M718 470h52l-10-38h-32z" fill="#0d1a12"/>
    <ellipse cx="744" cy="476" rx="26" ry="8" fill="#f6dfb8" opacity="0.55"/>
  </g>
</svg>
