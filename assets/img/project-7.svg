<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Concept study: open-plan workplace with workstations, monitors, planted screens and pendant lighting">
  <defs>
    <linearGradient id="p7wall" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#f8f3e9"/>
      <stop offset="1" stop-color="#e9dfcc"/>
    </linearGradient>
    <linearGradient id="p7floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6d8c0"/>
      <stop offset="1" stop-color="#d6c3a4"/>
    </linearGradient>
    <linearGradient id="p7sky" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#cdebd7"/>
      <stop offset="1" stop-color="#8fc7a3"/>
    </linearGradient>
    <linearGradient id="p7glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a6e0bb" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#17703f" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="p7desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0e6d3"/>
      <stop offset="1" stop-color="#dcc9a9"/>
    </linearGradient>
    <radialGradient id="p7glow" cx="0.5" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#f6dfb8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f6dfb8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p7slat" width="12" height="10" patternUnits="userSpaceOnUse">
      <rect width="12" height="10" fill="#b98d52"/>
      <rect width="6" height="10" fill="#a97b43"/>
    </pattern>
  </defs>

  <!-- room shell -->
  <rect width="800" height="1000" fill="url(#p7wall)"/>
  <rect y="700" width="800" height="300" fill="url(#p7floor)"/>
  <g stroke="#c9b490" stroke-width="2" opacity="0.5">
    <path d="M0 760h800M0 835h800M0 925h800"/>
    <path d="M120 700 40 1000M300 700l-30 300M520 700l20 300M700 700l60 300"/>
  </g>

  <!-- ceiling -->
  <rect width="800" height="96" fill="#fbf9f3"/>
  <path d="M0 96h800" stroke="#d9cbb4" stroke-width="3"/>
  <g stroke="#0d1a12" stroke-opacity="0.12" stroke-width="2">
    <path d="M140 0v96M400 0v96M660 0v96"/>
  </g>

  <!-- glazed wall + view -->
  <g>
    <rect x="512" y="132" width="236" height="452" rx="6" fill="url(#p7sky)"/>
    <g fill="#17703f" opacity="0.55">
      <path d="M512 470c34-38 58-30 84-54 22-20 36-44 58-48 30-5 50 30 94 26v138H512z"/>
      <path d="M512 508c42-24 70-14 104-34 26-16 48-34 78-24 22 8 34 24 54 28v106H512z"/>
    </g>
    <g fill="#0f4d29" opacity="0.28">
      <rect x="540" y="392" width="26" height="192"/>
      <rect x="590" y="352" width="34" height="232"/>
      <rect x="656" y="376" width="22" height="208"/>
    </g>
    <rect x="512" y="132" width="236" height="452" rx="6" fill="url(#p7glass)"/>
    <g stroke="#0d1a12" stroke-width="7" fill="none">
      <rect x="512" y="132" width="236" height="452" rx="6"/>
      <path d="M512 344h236M630 132v452"/>
    </g>
    <!-- sill -->
    <rect x="496" y="578" width="268" height="14" rx="4" fill="#0f4d29"/>
  </g>

  <!-- acoustic panels + wall art -->
  <g>
    <rect x="70" y="170" width="250" height="240" rx="12" fill="#dcebd5"/>
    <rect x="90" y="190" width="210" height="200" rx="8" fill="none" stroke="#17703f" stroke-opacity="0.22" stroke-width="2"/>
    <g fill="#17703f" opacity="0.5">
      <path d="M96 352c42-66 72-30 102-66 22-26 40-48 84-30 22 9 36 22 56 22v92H96z"/>
    </g>
    <rect x="70" y="170" width="250" height="240" rx="12" fill="none" stroke="#0d1a12" stroke-opacity="0.15" stroke-width="3"/>
    <g>
      <rect x="76" y="440" width="238" height="10" rx="4" fill="#c79a5b"/>
      <g stroke="#0f4d29" stroke-width="3" fill="none">
        <circle cx="132" cy="424" r="18"/>
        <path d="M188 440v-34h48v34M244 440v-22h44v22"/>
      </g>
    </g>
  </g>

  <!-- slatted feature wall -->
  <rect x="70" y="470" width="286" height="230" rx="8" fill="url(#p7slat)"/>
  <rect x="70" y="470" width="286" height="230" rx="8" fill="none" stroke="#0d1a12" stroke-opacity="0.16" stroke-width="3"/>
  <rect x="320" y="470" width="12" height="230" fill="#8a6231" opacity="0.55"/>

  <!-- pendant bars -->
  <g>
    <rect x="252" y="96" width="6" height="86" fill="#0d1a12" opacity="0.7"/>
    <rect x="252" y="96" width="290" height="6" rx="3" fill="#0d1a12" opacity="0.7"/>
    <rect x="536" y="96" width="6" height="86" fill="#0d1a12" opacity="0.7"/>
    <rect x="300" y="182" width="118" height="8" rx="4" fill="#c79a5b"/>
    <rect x="300" y="182" width="118" height="8" rx="4" fill="none" stroke="#86632b" stroke-opacity="0.4" stroke-width="1"/>
    <rect x="446" y="182" width="88" height="8" rx="4" fill="#c79a5b"/>
    <ellipse cx="359" cy="206" rx="92" ry="24" fill="url(#p7glow)"/>
    <ellipse cx="490" cy="206" rx="70" ry="20" fill="url(#p7glow)"/>
  </g>

  <!-- planted divider -->
  <g>
    <rect x="372" y="576" width="120" height="128" rx="8" fill="#0f4d29"/>
    <rect x="382" y="586" width="100" height="108" rx="6" fill="#17703f" opacity="0.55"/>
    <g fill="#a6e0bb">
      <circle cx="404" cy="586" r="22"/>
      <circle cx="440" cy="574" r="26"/>
      <circle cx="474" cy="590" r="20"/>
      <circle cx="420" cy="612" r="18"/>
      <circle cx="460" cy="620" r="22"/>
    </g>
    <g fill="#6fb98a" opacity="0.8">
