<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Concept study: staircase with stepped joinery and a brass pendant">
  <defs>
    <linearGradient id="p5bg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#f3ecdf"/>
      <stop offset="1" stop-color="#e0cfb2"/>
    </linearGradient>
    <linearGradient id="p5step" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#17703f"/>
      <stop offset="1" stop-color="#0b3d20"/>
    </linearGradient>
    <linearGradient id="p5light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6dcb2" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#f6dcb2" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#p5bg)"/>

  <!-- window light -->
  <rect x="480" y="90" width="220" height="360" fill="url(#p5light)"/>

  <!-- stepped joinery mass -->
  <g>
    <path d="M80 900V760h100V620h100V480h100V340h100V200h140v700z" fill="url(#p5step)"/>
    <g stroke="#a6e0bb" stroke-opacity="0.35" stroke-width="2">
      <path d="M180 760h-100M280 620h-100M380 480h-100M480 340h-100M620 200h-140"/>
      <path d="M180 760V620M280 620V480M380 480V340M480 340V200"/>
    </g>
    <!-- shelf lines inside the mass -->
    <g stroke="#a6e0bb" stroke-opacity="0.18" stroke-width="2">
      <path d="M100 820h80M200 700h80M300 560h80M400 420h80M500 280h120"/>
    </g>
  </g>

  <!-- handrail -->
  <path d="M96 806L216 666l100-140 100-140 100-140 104-144" fill="none" stroke="#c79a5b" stroke-width="7" stroke-linecap="round"/>
  <g fill="#c79a5b">
    <circle cx="96" cy="806" r="8"/><circle cx="216" cy="666" r="8"/><circle cx="316" cy="526" r="8"/>
    <circle cx="416" cy="386" r="8"/><circle cx="516" cy="246" r="8"/><circle cx="620" cy="102" r="8"/>
  </g>

  <!-- lower treads -->
  <g fill="#e7dcc7" stroke="#0f4d29" stroke-width="3">
    <rect x="80" y="900" width="180" height="34" rx="6"/>
    <rect x="80" y="934" width="240" height="34" rx="6"/>
  </g>

  <!-- pendant -->
  <g>
    <path d="M520 90v120" stroke="#0f4d29" stroke-width="3"/>
    <path d="M492 250c0-28 12-48 28-48s28 20 28 48z" fill="#c79a5b"/>
    <circle cx="520" cy="262" r="22" fill="#f6dcb2" opacity="0.6"/>
    <circle cx="520" cy="262" r="7" fill="#fff8ea"/>
  </g>

  <!-- floor -->
  <path d="M0 968h800" stroke="#0f4d29" stroke-opacity="0.2" stroke-width="2"/>

  <!-- planter -->
  <g transform="translate(700 870)">
    <path d="M0 0v-86" stroke="#0f4d29" stroke-width="3.5"/>
    <path d="M0 -50c-22-6-32-22-32-48 20 4 30 18 32 48z" fill="#17703f"/>
    <path d="M0 -60c20-8 28-24 26-50-18 6-28 22-26 50z" fill="#a6e0bb"/>
    <path d="M-22 -34h44l-6 64h-32z" fill="#e7dcc7" stroke="#0f4d29" stroke-width="2.5"/>
  </g>
</svg>
